name: ci
on:
  push:
    branches: ["ca/**"]
jobs:
  # Not required anywhere: it fails on `known bad`, so acceptance check 14 can see a failing, non-gating check.
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --test
  # The required check. It waits five minutes so the head is seen `verifying`, and fails when the repository variable CA_E2E_QUICK_FAIL is 1.
  quick:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 300
      - run: |
          if [ "${{ vars.CA_E2E_QUICK_FAIL }}" = "1" ]; then echo "CA_E2E_QUICK_FAIL=1"; exit 1; fi
